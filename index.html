<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda Online</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding-bottom: 60px; }
    header { background: #111827; color: white; padding: 20px; text-align: center; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .price { font-size: 1.25rem; font-weight: bold; color: #059669; margin: 10px 0; }
    .btn { background: #2563eb; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    .btn:hover { background: #1d4ed8; }
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid #e5e7eb; padding: 15px; display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
    .btn-ws { background: #25D366; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; }
    .btn-mp { background: #009EE3; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-left: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>Catálogo de Productos</h1>
  </header>

  <div class="container">
    <div id="productos-grid" class="grid"></div>
  </div>

  <div class="cart-bar">
    <div>
      <strong>Total Carrito: </strong>$<span id="total">0</span>
    </div>
    <div>
      <a id="btn-mp" href="https://link.mercadopago.com.ar/gyeimlorts" target="_blank" class="btn-mp">Pagar con Mercado Pago</a>
      <button onclick="enviarWhatsApp()" class="btn-ws">Pedir por WhatsApp</button>
    </div>
  </div>

  <script>
    const miNumeroWhatsApp = "542976214269";
    const productosPredeterminados = [
      { id: 1, nombre: "Auriculares JBL Wave 380", precio: 120000, imagen: "https://via.placeholder.com/300x200?text=JBL+Wave+380", descripcion: "Auriculares Bluetooth con sonido Pure Bass y estuche de carga." }
    ];

    let carrito = [];

    function obtenerProductos() {
      const guardados = localStorage.getItem("mis_productos_tienda");
      return guardados ? JSON.parse(guardados) : productosPredeterminados;
    }

    function renderizarProductos() {
      const grid = document.getElementById("productos-grid");
      const lista = obtenerProductos();
      grid.innerHTML = "";
      
      lista.forEach(p => {
        grid.innerHTML += `
          <div class="card">
            <img src="${p.imagen}" alt="${p.nombre}">
            <div class="card-body">
              <div>
                <h3>${p.nombre}</h3>
                <p style="font-size:0.9rem; color:#666; margin-top:5px;">${p.descripcion}</p>
              </div>
              <div>
                <div class="price">$${p.precio.toLocaleString()}</div>
                <button class="btn" onclick="agregarAlCarrito(${p.id})">Agregar al Carrito</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function agregarAlCarrito(id) {
      const producto = obtenerProductos().find(p => p.id === id);
      carrito.push(producto);
      actualizarTotal();
      alert(`Agregado: ${producto.nombre}`);
    }

    function actualizarTotal() {
      const total = carrito.reduce((sum, item) => sum + item.precio, 0);
      document.getElementById("total").innerText = total.toLocaleString();
    }

    function enviarWhatsApp() {
      if (carrito.length === 0) return alert("El carrito está vacío");
      let mensaje = "¡Hola! Quisiera encargar los siguientes productos:\n\n";
      carrito.forEach(item => {
        mensaje += `- ${item.nombre}: $${item.precio.toLocaleString()}\n`;
      });
      const total = carrito.reduce((sum, item) => sum + item.precio, 0);
      mensaje += `\n*Total: $${total.toLocaleString()}*`;
      
      window.open(`https://wa.me/${miNumeroWhatsApp}?text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    renderizarProductos();
  </script>
</body>
</html>
