<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda Cyberpunk - Catálogo Futurista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(56, 189, 248, 0.2);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.4);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --ws: #22c55e;
      --mp: #009EE3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 120px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(244, 63, 94, 0.08) 0%, transparent 45%);
    }

    header {
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 40px 20px;
      text-align: center;
      position: relative;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }

    header p {
      color: var(--text-muted);
      margin-top: 10px;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 10px 30px -5px var(--primary-glow);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      background: #111827;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    .card-body {
      padding: 24px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .price-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary-glow);
      margin-bottom: 16px;
    }

    .btn-add {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-add:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .cart-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 900px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.15);
      z-index: 1000;
    }

    .total-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .total-amount {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-ws {
      background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
    }

    .btn-mp {
      background: linear-gradient(135deg, #009EE3 0%, #0072ac 100%);
      box-shadow: 0 4px 15px rgba(0, 158, 227, 0.3);
    }

    .btn-action:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <header>
    <h1>CyberStore</h1>
    <p>Catálogo de Tecnología y Equipamiento Futurista</p>
  </header>

  <div class="container">
    <div id="productos-grid" class="grid"></div>
  </div>

  <div class="cart-bar">
    <div>
      <div class="total-label">Total en Carrito</div>
      <div class="total-amount">$<span id="total">0</span></div>
    </div>
    <div class="actions">
      <button onclick="pagarMercadoPago()" class="btn-action btn-mp">Pagar con Mercado Pago</button>
      <button onclick="enviarWhatsApp()" class="btn-action btn-ws">Pedir por WhatsApp</button>
    </div>
  </div>

  <script>
    const miNumeroWhatsApp = "542976214269";
    const miLinkMercadoPagoGeneral = "https://link.mercadopago.com.ar/gyeimlorts";
    const productosPredeterminados = [
      { 
        id: 1, 
        nombre: "Auriculares JBL Wave 380", 
        precio: 120000, 
        imagen: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=600&auto=format&fit=crop&q=80", 
        linkMp: "", 
        descripcion: "Auriculares Bluetooth True Wireless con sonido JBL Deep Bass y estuche de carga inteligente." 
      }
    ];

    let carrito = [];

    function registrarVisita() {
      let visitas = parseInt(localStorage.getItem("metricas_visitas") || "0");
      localStorage.setItem("metricas_visitas", (visitas + 1).toString());
    }

    function obtenerProductos() {
      const guardados = localStorage.getItem("mis_productos_tienda");
      return guardados ? JSON.parse(guardados) : productosPredeterminados;
    }

    function renderizarProductos() {
      const grid = document.getElementById("productos-grid");
      const lista = obtenerProductos();
      grid.innerHTML = "";
      
      lista.forEach(p => {
        grid.innerHTML += `
          <div class="card">
            <div class="card-img-wrap">
              <img src="${p.imagen}" alt="${p.nombre}">
            </div>
            <div class="card-body">
              <div>
                <h3 class="card-title">${p.nombre}</h3>
                <p class="card-desc">${p.descripcion}</p>
              </div>
              <div>
                <div class="price-tag">$${p.precio.toLocaleString()}</div>
                <button class="btn-add" onclick="agregarAlCarrito(${p.id})">Agregar al Carrito</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function agregarAlCarrito(id) {
      const producto = obtenerProductos().find(p => p.id === id);
      carrito.push(producto);
      actualizarTotal();
    }

    function actualizarTotal() {
      const total = carrito.reduce((sum, item) => sum + item.precio, 0);
      document.getElementById("total").innerText = total.toLocaleString();
    }

    function registrarIntentoCompra(monto) {
      let intCompradores = parseInt(localStorage.getItem("metricas_intentos") || "0");
      let totalVendidoSimulado = parseFloat(localStorage.getItem("metricas_total_monto") || "0");
      
      localStorage.setItem("metricas_intentos", (intCompradores + 1).toString());
      localStorage.setItem("metricas_total_monto", (totalVendidoSimulado + monto).toString());
    }

    function pagarMercadoPago() {
      if (carrito.length === 0) return alert("El carrito está vacío");

      const total = carrito.reduce((sum, item) => sum + item.precio, 0);
      registrarIntentoCompra(total);

      if (carrito.length === 1 && carrito[0].linkMp && carrito[0].linkMp.trim() !== "") {
        window.open(carrito[0].linkMp, '_blank');
      } else {
        window.open(miLinkMercadoPagoGeneral, '_blank');
      }
    }

    function enviarWhatsApp() {
      if (carrito.length === 0) return alert("El carrito está vacío");

      const total = carrito.reduce((sum, item) => sum + item.precio, 0);
      registrarIntentoCompra(total);

      let mensaje = "¡Hola! Quisiera encargar los siguientes productos:\n\n";
      carrito.forEach(item => {
        mensaje += `- ${item.nombre}: $${item.precio.toLocaleString()}\n`;
      });
      mensaje += `\n*Total a pagar: $${total.toLocaleString()}*`;
      
      window.open(`https://wa.me/${miNumeroWhatsApp}?text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    registrarVisita();
    renderizarProductos();
  </script>
</body>
</html>
